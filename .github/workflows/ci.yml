name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-gate:
    name: Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright on production code and tests
        run: uv run --frozen pyright src/sattlint tests

      # The changelog and the package version must name the same release. This
      # runs on its own so a mismatch fails with a named check instead of inside
      # the full suite.
      - name: Release state check
        run: uv run --frozen python -m pytest tests/test_release_state.py -q

      # Only a tagged build compares against a tag, so ordinary branch and pull
      # request runs need no git metadata. The tag is the version with its
      # leading "v" removed.
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(uv run --frozen python -c 'from sattlint import __version__; print(__version__)')"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package version '${actual}'"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${actual}"

      # Ruff, Pyright, and the docs check run above or in their own job; the
      # remaining hooks keep whitespace, end-of-file, YAML/TOML,
      # merge-conflict, line-ending and large-file checks on CI instead of only
      # on developer machines.
      - name: Pre-commit hygiene hooks
        env:
          SKIP: ruff,ruff-format,pyright,docs-check
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Full pytest with coverage
        run: >-
          uv run --frozen python -m pytest -q --tb=short --cov=sattlint
          --cov-report=term-missing --cov-fail-under=80

      - name: Package smoke (clean wheel install)
        run: |
          uv run --frozen python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install /tmp/dist/*.whl
          /tmp/clean-venv/bin/python -c "import sattlint; assert sattlint.__version__; print('version', sattlint.__version__)"
          /tmp/clean-venv/bin/python -c "import sattlint.ui; print('ui package importable')"
          /tmp/clean-venv/bin/python -c "from sattlint.cli.startup import cli; print('entry point reachable')"

  packaging:
    name: Packaging (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # A fixed epoch makes the wheel byte-reproducible; the sdist backend
      # stamps its archive metadata with the build instant, so its members are
      # compared by content instead.
      SOURCE_DATE_EPOCH: "1735689600"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build both distributions twice
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir dist-a
          python -m build --outdir dist-b
          # The wheel is byte-identical under a fixed SOURCE_DATE_EPOCH.
          for wheel in dist-a/*.whl; do
            cmp "${wheel}" "dist-b/$(basename "${wheel}")"
          done
          # The sdist backend stamps the archive metadata with the build
          # instant, so compare the members and their bytes instead.
          python - <<'PY'
          import glob
          import hashlib
          import tarfile

          def contents(pattern):
              path = glob.glob(pattern)[0]
              with tarfile.open(path) as archive:
                  return {
                      member.name: hashlib.sha256(archive.extractfile(member).read()).hexdigest()
                      for member in archive.getmembers()
                      if member.isfile()
                  }

          assert contents("dist-a/*.tar.gz") == contents("dist-b/*.tar.gz")
          print("sdist member contents are identical")
          PY

      - name: Check distribution metadata
        run: python -m twine check dist-a/*

      # Both artifacts must install and expose the same commands, on every
      # supported interpreter. Installing the sdist proves it carries the
      # package data, not just the wheel.
      - name: Install the wheel and the sdist into clean environments
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for artifact in dist-a/*.whl dist-a/*.tar.gz; do
            index=$((index + 1))
            venv="/tmp/artifact-venv-${index}"
            python -m venv "${venv}"
            "${venv}/bin/python" -m pip install --upgrade pip
            "${venv}/bin/python" -m pip install "${artifact}"
            "${venv}/bin/sattlint" --version
            "${venv}/bin/sattlint" analyzers list >/dev/null
          done

      - name: Verify the wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist-a/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()

          assert "sattlint/ui/app_textual.tcss" in names
          assets = [name for name in names if name.startswith("sattlint/assets/") and not name.endswith("/")]
          assert assets, "wheel carries no package assets"
          print("wheel contents OK")
          PY

      - name: Verify the sdist contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile

          sdist = glob.glob("dist-a/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              names = archive.getnames()

          required = ("CHANGELOG.md", "LICENSE", "README.md", "app_textual.tcss")
          for suffix in required:
              assert any(name.endswith(suffix) for name in names), suffix
          for excluded in ("/tests/", "/.github/", "/docs/", "/scripts/"):
              assert not any(excluded in name for name in names), excluded
          # ``SOURCES.txt`` is the one egg-info member setuptools appends after
          # the manifest is applied; nothing else from the generated tree ships.
          egg_info = [name for name in names if ".egg-info/" in name and not name.endswith("/SOURCES.txt")]
          assert not egg_info, egg_info
          print("sdist contents OK")
          PY

  windows-gate:
    name: Windows gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright on production code and tests
        run: uv run --frozen pyright src/sattlint tests

      - name: Full pytest
        run: uv run --frozen python -m pytest -q --tb=short

      - name: Package smoke (clean wheel install)
        shell: bash
        run: |
          uv run --frozen python -m build --wheel --outdir dist
          python -m venv /tmp/clean-venv-win
          /tmp/clean-venv-win/Scripts/pip install dist/*.whl
          /tmp/clean-venv-win/Scripts/python -c "import sattlint; assert sattlint.__version__; print('version', sattlint.__version__)"
          /tmp/clean-venv-win/Scripts/python -c "import sattlint.ui; print('ui package importable')"
          /tmp/clean-venv-win/Scripts/python -c "from sattlint.cli.startup import cli; print('entry point reachable')"

  fuzz-smoke:
    name: Fuzz smoke (SattLint-owned readers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # atheris publishes manylinux x86_64 wheels only. Fail with a clear
      # message if the job ever moves to another architecture or OS rather than
      # letting dependency resolution fail with an unrelated error.
      - name: Require a Linux x86_64 runner
        run: |
          if [ "$(uname -s)/$(uname -m)" != "Linux/x86_64" ]; then
            echo "::error::the fuzz extra requires a Linux x86_64 runner (atheris wheels)"
            exit 1
          fi

      - name: Install the locked fuzz environment
        run: uv sync --locked --extra fuzz

      - name: ICF reader fuzz smoke
        run: uv run --frozen python scripts/fuzz/icf_fuzzer.py -runs=200000 -max_len=4096 -timeout=5

      - name: Graphics validator fuzz smoke
        run: uv run --frozen python scripts/fuzz/graphics_fuzzer.py -runs=200000 -max_len=4096 -timeout=5

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --locked --extra dev

      - name: Audit the locked dependency set
        run: uv run --frozen pip-audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check documentation links
        run: python scripts/check_docs.py
