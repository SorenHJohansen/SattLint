name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-gate:
    name: Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install package with dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pyright on production code
        run: python -m pyright src/sattlint

      - name: Full pytest with coverage
        run: python -m pytest -q --tb=short --cov=sattlint --cov-report=term-missing

      - name: Package smoke (clean wheel install)
        run: |
          python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install /tmp/dist/*.whl
          /tmp/clean-venv/bin/sattlint --version
          /tmp/clean-venv/bin/sattlint --help
          /tmp/clean-venv/bin/sattlint syntax-check tests/fixtures/sample_sattline_files/SattLineFullGrammarTest.s

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel in clean venv
        shell: bash
        run: |
          python -m venv /tmp/clean-venv-win
          /tmp/clean-venv-win/Scripts/pip install dist/*.whl
          /tmp/clean-venv-win/Scripts/sattlint --version
          /tmp/clean-venv-win/Scripts/sattlint --help
          /tmp/clean-venv-win/Scripts/sattlint syntax-check tests/fixtures/sample_sattline_files/SattLineFullGrammarTest.s
