name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-gate:
    name: Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright on production code and tests
        run: uv run --frozen pyright src/sattlint tests

      - name: Full pytest with coverage
        run: >-
          uv run --frozen python -m pytest -q --tb=short --cov=sattlint
          --cov-report=term-missing --cov-fail-under=80

      - name: Package smoke (clean wheel install)
        run: |
          uv run --frozen python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install /tmp/dist/*.whl
          /tmp/clean-venv/bin/python -c "import sattlint; assert sattlint.__version__; print('version', sattlint.__version__)"
          /tmp/clean-venv/bin/python -c "import sattlint.ui; print('ui package importable')"
          /tmp/clean-venv/bin/python -c "from sattlint.cli.startup import cli; print('entry point reachable')"

  windows-gate:
    name: Windows gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright on production code and tests
        run: uv run --frozen pyright src/sattlint tests

      - name: Full pytest
        run: uv run --frozen python -m pytest -q --tb=short

      - name: Package smoke (clean wheel install)
        shell: bash
        run: |
          uv run --frozen python -m build --wheel --outdir dist
          python -m venv /tmp/clean-venv-win
          /tmp/clean-venv-win/Scripts/pip install dist/*.whl
          /tmp/clean-venv-win/Scripts/python -c "import sattlint; assert sattlint.__version__; print('version', sattlint.__version__)"
          /tmp/clean-venv-win/Scripts/python -c "import sattlint.ui; print('ui package importable')"
          /tmp/clean-venv-win/Scripts/python -c "from sattlint.cli.startup import cli; print('entry point reachable')"

  fuzz-smoke:
    name: Fuzz smoke (SattLint-owned readers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked fuzz environment
        run: uv sync --frozen --extra fuzz

      - name: ICF reader fuzz smoke
        run: uv run --frozen python scripts/fuzz/icf_fuzzer.py -runs=200000 -max_len=4096 -timeout=5

      - name: Graphics validator fuzz smoke
        run: uv run --frozen python scripts/fuzz/graphics_fuzzer.py -runs=200000 -max_len=4096 -timeout=5

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --frozen --extra dev

      - name: Audit the locked dependency set
        run: uv run --frozen pip-audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@913db5cf77ef624b914090bad9e1615f7f6e099d # v25.0.0
        with:
          globs: |
            *.md
            docs/**/*.md
            .github/**/*.md

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check documentation links
        run: python scripts/check_docs.py
