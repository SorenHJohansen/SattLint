name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up shared CI tooling
        uses: ./.github/actions/setup-ci-tooling
        with:
          dependency-spec: ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Generate SBOM
        shell: bash
        run: |
          pip install "cyclonedx-bom==7.3.0" --hash=sha256:73d7d76b3a28ebadc50eabf424cbcf128785a74b8a59ce7893da2e29cfaab585
          cyclonedx-py requirements --pyproject -o dist/sbom.json

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Run release smoke rehearsal
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          if [[ -z "$wheel_path" ]]; then
            echo "Built wheel not found in dist/" >&2
            exit 1
          fi
          sattlint-release-smoke \
            --wheel "$wheel_path" \
            --sample-file tests/fixtures/sample_sattline_files/SattLineFullGrammarTest.s \
            --output-dir artifacts/release-smoke

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: pypi-dist-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json

      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: release-smoke-${{ github.run_id }}
          path: artifacts/release-smoke/

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
