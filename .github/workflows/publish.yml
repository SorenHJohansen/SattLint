name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version (for example 2026.11.4); checked against the package metadata"
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the locked dev environment
        run: uv sync --frozen --extra dev

      # A release may not publish a package whose internal version differs from
      # the git tag (or the explicitly supplied workflow_dispatch version).
      - name: Check tag/version consistency
        shell: bash
        run: |
          package_version="$(uv run --frozen python -c 'from sattlint import __version__; print(__version__)')"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="${GITHUB_REF#refs/tags/v}"
          else
            expected="${{ inputs.version }}"
          fi
          if [[ -n "${expected}" && "${expected}" != "${package_version}" ]]; then
            echo "::error::Tag/dispatch version '${expected}' does not match package version '${package_version}'"
            exit 1
          fi
          echo "Version consistency OK: ${package_version}"

      - name: Build distributions
        run: uv run --frozen python -m build

      - name: Check distribution metadata
        run: uv run --frozen python -m twine check dist/*

      - name: Clean-wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/python -c "import sattlint; assert sattlint.__version__; print('version', sattlint.__version__)"
          /tmp/clean-venv/bin/python -c "import sattlint.ui; print('ui package importable')"
          /tmp/clean-venv/bin/python -c "from sattlint.cli.startup import cli; print('entry point reachable')"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          name: pypi-dist-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
